name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

# A new push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  api:
    name: API build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json   # same SDK as local (8.0.428)
          cache: false

      # Building the test project also builds Kopeck.Api and Kopeck.Contracts.
      # Warnings are errors here (Directory.Build.props).
      - name: Build
        run: dotnet build tests/Kopeck.Api.Tests -c Release

      - name: Test
        run: dotnet test tests/Kopeck.Api.Tests -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 7

  mobile-android:
    name: Mobile build (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Compile only (no signing/packaging) to catch XAML, binding and C# errors.
      - name: Build
        run: dotnet build src/Kopeck.Mobile -f net8.0-android -c Release

  # iOS needs macOS + Xcode (a more expensive runner), so it is manual only:
  # Actions tab -> CI -> Run workflow.
  mobile-ios:
    name: Mobile build (iOS)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: false
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios
      - name: Build (simulator, no signing)
        run: dotnet build src/Kopeck.Mobile -f net8.0-ios -c Release -p:RuntimeIdentifier=iossimulator-arm64
